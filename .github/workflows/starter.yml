# "Docs que compilan": el starter contiene el EJEMPLO DORADO del skill de
# autoría (docs/SKILL-crear-tema.md). Si el SDK cambia y rompe el contrato que
# el skill documenta, este build falla y nos enteramos aquí — no el usuario.
name: starter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # El starter depende del SDK con `file:../..` (symlink): el SDK necesita
      # sus propias dependencias instaladas para que se resuelvan (p.ej. motion).
      - name: Instalar dependencias del SDK
        run: npm install

      - name: Instalar dependencias del starter
        run: npm install --prefix examples/starter

      # Auditoría del contrato: si un cambio del SDK rompe lo que el skill
      # promete (ids, data-mark-id, .name/.label, disclosure…), falla aquí.
      - name: Verificar el contrato de los temas
        run: npm run verify --prefix examples/starter

      - name: Compilar el starter (temas de ejemplo del skill)
        run: npm run build --prefix examples/starter

      - name: Comprobar que se generó el HTML autocontenido
        run: test -s examples/starter/dist/index.html
